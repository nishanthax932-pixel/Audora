<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An AI workspace with configurable model providers. Review provider privacy settings before sharing sensitive information." />
    <title>AI workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-top"><a class="brand" href="/" aria-label="Home"><span class="orb"></span><span data-brand>Audora</span></a><button class="icon-button mobile-only" id="close-sidebar" aria-label="Close menu">×</button></div>
        <button class="new-chat" id="new-chat"><span>＋</span> New chat</button>
        <label class="sr-only" for="history-search">Search conversations</label>
        <input id="history-search" class="history-search" type="search" placeholder="Search chats" autocomplete="off" />
        <button id="export-chats" class="export-chats" type="button">↓ Export conversations</button>
        <nav id="history" aria-label="Chat history"></nav>
        <div class="sidebar-footer"><button class="workspace"><span class="workspace-mark" data-brand-initial>A</span><span><b data-brand>Audora</b><small data-tagline>Your intelligent workspace</small></span><span>···</span></button></div>
      </aside>
      <main class="workspace-main">
        <header class="topbar"><button class="icon-button mobile-only" id="open-sidebar" aria-label="Open menu">☰</button><div class="model-menu"><select id="model-select" aria-label="Choose model"></select><span>⌄</span></div><div class="topbar-actions"><button class="icon-button" id="theme-toggle" aria-label="Toggle theme">◐</button><button class="profile" id="profile-button" type="button" aria-label="Open Audora profile">N</button></div></header>
        <section class="chat-stage" id="chat-stage" aria-label="Chat with assistant">
          <div class="empty-state" id="empty-state"><div class="big-orb">✦</div><h1 id="welcome-heading">How can I help you?</h1><p>Ask, create, analyze, or explore anything.</p><div class="suggestions"><button>Help me plan a project</button><button>Explain a complex idea</button><button>Write and improve text</button></div></div>
          <div class="conversation" id="conversation" aria-live="polite"></div><section id="image-output" class="image-output" aria-live="polite" hidden></section>
        </section>
        <div class="composer-wrap"><div id="app-notice" class="app-notice" role="status" hidden></div><form id="chat-form" class="composer"><label class="sr-only" for="prompt">Message the assistant</label><input id="file-input" type="file" accept=".txt,.md,.csv,.json,.js,.py,.log,.xml" multiple hidden /><button id="attach-files" class="attach-button" type="button" aria-label="Attach text files" title="Attach text files">＋</button><button id="image-mode" class="attach-button" type="button" aria-label="Generate image" title="Generate with Audora self-hosted model">▧</button><button id="thinking-mode" class="attach-button" type="button" aria-pressed="false" aria-label="Toggle detailed explanation mode" title="Detailed explanation mode">🧠</button><textarea id="prompt" rows="1" maxlength="8000" placeholder="Message Audora" required></textarea><button id="stop-button" class="stop-button" type="button" aria-label="Stop generating" hidden>■</button><button id="send-button" type="submit" aria-label="Send message"><span>↑</span></button></form><div id="attachment-list" class="attachment-list" aria-live="polite"></div><p class="hint"><span data-brand>Audora</span> can make mistakes. Check important info.</p></div>
      </main>
    </div>
    <dialog class="profile-dialog" id="profile-dialog" aria-labelledby="profile-title"><form method="dialog" id="profile-form"><div class="profile-dialog-head"><div><p class="eyebrow">YOUR WORKSPACE</p><h2 id="profile-title">Audora profile</h2></div><button class="icon-button" value="cancel" aria-label="Close profile">×</button></div><div class="profile-avatar" id="profile-avatar">N</div><label for="profile-name">Display name</label><input id="profile-name" maxlength="60" autocomplete="name" placeholder="Your name"><label for="profile-email">Email (optional)</label><input id="profile-email" type="email" maxlength="120" autocomplete="email" placeholder="you@example.com"><label for="profile-memory">Personal memory for Audora</label><textarea id="profile-memory" maxlength="1200" rows="4" placeholder="Your goals, preferences, or ongoing projects..."></textarea><p class="profile-note">This profile is saved only in this browser. Cloud sign-in and cross-device sync are not enabled yet.</p><div class="profile-actions"><button class="profile-save" id="profile-save" value="save">Save profile</button></div></form></dialog>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/app.js"></script><script type="module" src="/image.js"></script>
  </body>
</html>
